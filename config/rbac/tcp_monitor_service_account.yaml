apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcp-monitor
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tcp-monitor
rules:
- apiGroups: [node-network-check-operator.medik8s.io]
  resources: [nodenetworkcheckoperatorconfigs]
  verbs: [list]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get]
- apiGroups: [""]
  resources: [nodes/status]
  verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcp-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tcp-monitor
subjects:
- kind: ServiceAccount
  name: tcp-monitor
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tcp-monitor-scc
rules:
- apiGroups: [security.openshift.io]
  resources: [securitycontextconstraints]
  resourceNames: [hostnetwork-v2]
  verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tcp-monitor-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tcp-monitor-scc
subjects:
# Kustomize sets the service account name. Leaving the subject namespace
# empty lets this binding use its own namespace when installed by OLM.
- kind: ServiceAccount
  name: tcp-monitor
