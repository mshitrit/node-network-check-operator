apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcp-listener
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tcp-listener-scc
rules:
- apiGroups: [security.openshift.io]
  resources: [securitycontextconstraints]
  resourceNames: [hostnetwork-v2]
  verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tcp-listener-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tcp-listener-scc
subjects:
# Kustomize sets the service account name. Leaving the subject namespace
# empty lets this binding use its own namespace when installed by OLM.
- kind: ServiceAccount
  name: tcp-listener
