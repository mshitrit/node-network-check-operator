---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - update
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - node-network-check-operator.medik8s.io
  resources:
  - nodenetworkcheckoperatorconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - node-network-check-operator.medik8s.io
  resources:
  - nodenetworkcheckoperatorconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - node-network-check-operator.medik8s.io
  resources:
  - nodenetworkcheckoperatorconfigs/status
  verbs:
  - get
  - patch
  - update
